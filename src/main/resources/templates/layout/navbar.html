<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark px-3">
    <button class="btn btn-outline-light btn-sm me-3 d-flex align-items-center gap-1"
            type="button" data-bs-toggle="offcanvas" data-bs-target="#appSidebar"
            aria-controls="appSidebar" aria-label="Abrir menú">
        <i class="bi bi-list fs-5"></i>
        <span class="d-none d-sm-inline">Menú</span>
    </button>
	<a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/dashboard}">
	    <img th:src="@{/images/logo-logistiq.jpg}" alt="LOGISTIQ" height="28">
	    <span>LOGISTIQ &middot; Recomendación de Compra</span>
	</a>
    <div class="ms-auto d-flex align-items-center">
        <span class="text-light small me-3">
            <i class="bi bi-person-circle me-1"></i>
            <span sec:authentication="name">usuario</span>
        </span>
        <form th:action="@{/logout}" method="post" class="d-inline">
            <button type="submit" class="btn btn-outline-light btn-sm">
                <i class="bi bi-box-arrow-right me-1"></i>Cerrar sesión
            </button>
        </form>
    </div>
</nav>
</body>
</html>
