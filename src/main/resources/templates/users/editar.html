<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{layout/base :: head-assets}"></th:block>
    <title>Editar usuario</title>
</head>
<body>
<div th:replace="~{layout/navbar :: navbar}"></div>
<div th:replace="~{layout/sidebar :: sidebar}"></div>
<div class="container-fluid">
        <div class="col-md-2 p-0" th:replace="~{layout/sidebar :: sidebar}"></div>
        <main class="py-4">

            <h2 class="mb-4">Editar usuario</h2>

            <form th:action="@{/users/{id}/edit(id=${userForm.id})}" th:object="${userForm}" method="post" style="max-width: 500px;">
                <input type="hidden" th:field="*{id}">
                <div class="mb-3">
                    <label class="form-label">Nombre</label>
                    <input type="text" th:field="*{name}" class="form-control">
                    <div class="text-danger small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" th:field="*{email}" class="form-control">
                    <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Nueva contraseña (dejar vacío para no cambiarla)</label>
                    <input type="password" th:field="*{password}" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Rol</label>
                    <select th:field="*{role}" class="form-select">
                        <option value="ADMIN">Administrador</option>
                        <option value="EMPLOYEE">Empleado</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary">Guardar cambios</button>
                <a th:href="@{/users}" class="btn btn-outline-secondary">Cancelar</a>
            </form>

        </main>
    </div>
</body>
</html>
