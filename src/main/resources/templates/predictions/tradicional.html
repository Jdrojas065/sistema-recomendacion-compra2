<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{layout/base :: head-assets}"></th:block>
    <title>Predicción tradicional</title>
</head>
<body>
<div th:replace="~{layout/navbar :: navbar}"></div>
<div th:replace="~{layout/sidebar :: sidebar}"></div>
<div class="container-fluid">
        <div class="col-md-2 p-0" th:replace="~{layout/sidebar :: sidebar}"></div>
        <main class="py-4">

            <h2 class="mb-4" th:text="'Predicción tradicional - ' + ${product.name}">Predicción</h2>

            <div th:if="${!result.sufficientData()}" class="alert alert-warning">
                No hay suficiente historial de ventas para calcular una predicción confiable de este producto.
            </div>

            <div th:if="${result.sufficientData()}" class="card" style="max-width: 400px;">
                <div class="card-body">
                    <p>Método: <strong th:text="${result.method()}"></strong></p>
                    <p>Periodos analizados (meses): <strong th:text="${result.periodsUsed()}"></strong></p>
                    <p>Datos analizados: <strong th:text="${result.dataPointsAnalyzed()}"></strong></p>
                    <p>Demanda estimada: <strong th:text="${result.estimatedDemand()}"></strong></p>
                </div>
            </div>

            <a th:href="@{/predictions/compare/{id}(id=${product.id})}" class="btn btn-outline-secondary btn-sm mt-3">Comparar con Machine Learning</a>
            <a th:href="@{/products/{id}(id=${product.id})}" class="btn btn-secondary btn-sm mt-3">Volver al producto</a>

        </main>
    </div>
</body>
</html>
