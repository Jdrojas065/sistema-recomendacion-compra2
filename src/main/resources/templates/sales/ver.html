<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{layout/base :: head-assets}"></th:block>
    <title>Detalle de venta</title>
</head>
<body>
<div th:replace="~{layout/navbar :: navbar}"></div>
<div th:replace="~{layout/sidebar :: sidebar}"></div>
<div class="container-fluid">
        <div class="col-md-2 p-0" th:replace="~{layout/sidebar :: sidebar}"></div>
        <main class="py-4">

            <h2 class="mb-4">Venta #<span th:text="${sale.id}"></span></h2>
            <p>Fecha: <span th:text="${#temporals.format(sale.date, 'dd/MM/yyyy HH:mm')}"></span></p>
            <p>Registrada por: <span th:text="${sale.user.name}"></span></p>

            <table class="table">
                <thead><tr><th>Producto</th><th>Cant.</th><th>Precio unit.</th><th>Subtotal</th></tr></thead>
                <tbody>
                <tr th:each="d : ${sale.details}">
                    <td th:text="${d.product.name}">Producto</td>
                    <td th:text="${d.quantity}">0</td>
                    <td th:text="${'$' + #numbers.formatDecimal(d.unitPrice, 1, 2)}">$0.00</td>
                    <td th:text="${'$' + #numbers.formatDecimal(d.subtotal, 1, 2)}">$0.00</td>
                </tr>
                </tbody>
                <tfoot>
                <tr>
                    <td colspan="3" class="text-end fw-bold">Total</td>
                    <td class="fw-bold" th:text="${'$' + #numbers.formatDecimal(sale.total, 1, 2)}">$0.00</td>
                </tr>
                </tfoot>
            </table>
			
			<a th:href="@{/sales/new}" class="btn btn-secondary btn-sm mt-2">Volver</a>

        </main>
    </div>

</body>
</html>
