<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{layout/base :: head-assets}"></th:block>
    <title>Anomalías</title>
</head>
<body>
<div th:replace="~{layout/navbar :: navbar}"></div>
<div th:replace="~{layout/sidebar :: sidebar}"></div>
<div class="container-fluid">
    <main class="py-4">

        <div class="mb-4">
            <h2 class="mb-1">Anomalías detectadas</h2>
            <p class="text-muted mb-0">Ventas que se alejan significativamente del comportamiento habitual de cada producto.</p>
        </div>

        <div class="row g-3 mb-4">
            <div class="col-sm-4">
                <div class="card summary-card summary-high">
                    <div class="card-body d-flex justify-content-between align-items-center">
                        <div>
                            <div class="summary-label">Severidad alta</div>
                            <div class="summary-value" th:text="${highCount}">0</div>
                        </div>
                        <i class="bi bi-exclamation-octagon-fill text-danger fs-3"></i>
                    </div>
                </div>
            </div>
            <div class="col-sm-4">
                <div class="card summary-card summary-medium">
                    <div class="card-body d-flex justify-content-between align-items-center">
                        <div>
                            <div class="summary-label">Severidad media</div>
                            <div class="summary-value" th:text="${mediumCount}">0</div>
                        </div>
                        <i class="bi bi-exclamation-circle-fill fs-3" style="color:#e8a33d;"></i>
                    </div>
                </div>
            </div>
            <div class="col-sm-4">
                <div class="card summary-card summary-low">
                    <div class="card-body d-flex justify-content-between align-items-center">
                        <div>
                            <div class="summary-label">Severidad baja</div>
                            <div class="summary-value" th:text="${lowCount}">0</div>
                        </div>
                        <i class="bi bi-info-circle-fill text-success fs-3"></i>
                    </div>
                </div>
            </div>
        </div>

        <div class="card data-card">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead>
                    <tr>
                        <th>Producto</th>
                        <th>Fecha</th>
                        <th>Esperado &rarr; Observado</th>
                        <th>Severidad</th>
                        <th>Descripción</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${anomalyPage.empty}">
                        <td colspan="5">
                            <div class="empty-state">
                                <i class="bi bi-shield-check"></i>
                                No hay anomalías registradas.
                            </div>
                        </td>
                    </tr>
                    <tr th:each="a : ${anomalyPage.content}">
                        <td class="fw-semibold" th:text="${a.product.name}">Producto</td>
                        <td class="text-muted small" th:text="${#temporals.format(a.date, 'dd/MM/yyyy HH:mm')}">Fecha</td>
                        <td>
                            <span class="value-transition">
                                <span th:text="${a.expectedValue}">0</span>
                                <i class="bi bi-arrow-right-short arrow"></i>
                                <span class="fw-semibold" th:text="${a.observedValue}">0</span>
                            </span>
                        </td>
                        <td>
                            <span class="priority-pill"
                                  th:classappend="${a.severity == 'HIGH'} ? 'pill-high' : (${a.severity == 'MEDIUM'} ? 'pill-medium' : 'pill-low')">
                                <i class="bi bi-record-fill" style="font-size: 0.55rem;"></i>
                                <span th:text="${a.severity}">HIGH</span>
                            </span>
                        </td>
                        <td class="text-muted small" th:text="${a.description}" style="max-width: 340px;">Descripción</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="mt-3" th:replace="~{layout/pagination :: pager(${anomalyPage}, '/anomalies')}"></div>

    </main>
</div>
</body>
</html>
