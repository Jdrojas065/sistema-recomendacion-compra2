<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{layout/base :: head-assets}"></th:block>
    <title>Productos</title>
</head>
<body>
<div th:replace="~{layout/navbar :: navbar}"></div>
<div th:replace="~{layout/sidebar :: sidebar}"></div>
<div class="container-fluid">
        <div class="col-md-2 p-0" th:replace="~{layout/sidebar :: sidebar}"></div>
        <main class="py-4">

            <div class="page-header d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="mb-1">Productos</h2>
                    <p class="page-subtitle mb-0">
                        <span th:text="${productPage.totalElements}">0</span> producto(s) registrado(s)
                    </p>
                </div>
                <a th:href="@{/products/new}" class="btn btn-primary">
                    <i class="bi bi-plus-lg me-1"></i>Nuevo producto
                </a>
            </div>

            <div th:if="${successMessage}" class="alert alert-success d-flex align-items-center gap-2" th:text="${successMessage}"></div>

            <!-- Toolbar: escaneo + filtros -->
            <div class="card toolbar-card mb-4">
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label" for="barcodeSearch">Buscar por código de barras</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-upc-scan"></i></span>
                                <input type="text" id="barcodeSearch" class="form-control"
                                       placeholder="Escanea o digita un código y presiona Enter"
                                       inputmode="numeric" autofocus>
                            </div>
                            <div id="barcodeSearchMsg" class="form-hint mt-1"></div>
                        </div>

                        <div class="col-md-8">
                            <form th:action="@{/products}" method="get" class="row g-3">
                                <div class="col-md-5">
                                    <label class="form-label">Nombre</label>
                                    <input type="text" name="name" class="form-control" placeholder="Buscar por nombre"
                                           th:value="${filterName}">
                                </div>
                                <div class="col-md-5">
                                    <label class="form-label">Categoría</label>
                                    <select name="categoryId" class="form-select">
                                        <option value="">Todas las categorías</option>
                                        <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"
                                                th:selected="${c.id == filterCategoryId}"></option>
                                    </select>
                                </div>
                                <div class="col-md-2 d-flex align-items-end">
                                    <button type="submit" class="btn btn-outline-secondary w-100">
                                        <i class="bi bi-funnel me-1"></i>Filtrar
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Tabla de productos -->
            <div class="card">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Código de barras</th>
                            <th>Categoría</th>
                            <th>Precio</th>
                            <th>Stock</th>
                            <th>Stock mín.</th>
                            <th class="text-end">Acciones</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${productPage.empty}">
                            <td colspan="7">
                                <div class="table-empty-state">
                                    <i class="bi bi-inboxes"></i>
                                    <span>No hay productos registrados.</span>
                                </div>
                            </td>
                        </tr>
                        <tr th:each="p : ${productPage.content}"
                            th:classappend="${p.currentStock <= p.minimumStock} ? 'row-low-stock'">
                            <td class="fw-medium" th:text="${p.name}">Producto</td>
                            <td class="text-muted small" th:text="${p.barcode} ?: '—'">—</td>
                            <td>
                                <span class="badge-category" th:text="${p.category.name}">Categoría</span>
                            </td>
                            <td class="text-nowrap" th:text="${'$' + #numbers.formatDecimal(p.price, 1, 2)}">$0.00</td>
                            <td>
                                <span class="stock-pill" th:classappend="${p.currentStock <= p.minimumStock} ? 'stock-low' : 'stock-ok'">
                                    <i class="bi" th:classappend="${p.currentStock <= p.minimumStock} ? 'bi-exclamation-triangle-fill' : 'bi-check-circle-fill'"></i>
                                    <span th:text="${p.currentStock}">0</span>
                                </span>
                            </td>
                            <td class="text-muted" th:text="${p.minimumStock}">0</td>
                            <td>
                                <div class="d-flex justify-content-end gap-1">
                                    <a th:href="@{/products/{id}(id=${p.id})}" class="btn btn-icon btn-outline-secondary"
                                       title="Ver detalle">
                                        <i class="bi bi-eye"></i>
                                    </a>
                                    <a th:href="@{/products/{id}/edit(id=${p.id})}" class="btn btn-icon btn-outline-primary"
                                       title="Editar">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <form th:action="@{/products/{id}/deactivate(id=${p.id})}" method="post" class="d-inline"
                                          onsubmit="return confirm('¿Dar de baja este producto?');">
                                        <button type="submit" class="btn btn-icon btn-outline-danger" title="Dar de baja">
                                            <i class="bi bi-slash-circle"></i>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="mt-3" th:replace="~{layout/pagination :: pager(${productPage}, '/products')}"></div>

            <script th:inline="javascript">
                document.getElementById('barcodeSearch').addEventListener('keydown', function (e) {
                    if (e.key !== 'Enter') return;
                    e.preventDefault();
                    var input = this;
                    var code = input.value.trim();
                    var msg = document.getElementById('barcodeSearchMsg');
                    if (!code) return;

                    msg.className = 'form-hint mt-1 text-muted';
                    msg.innerHTML = '<i class="bi bi-hourglass-split me-1"></i>Buscando...';
                    input.disabled = true;

                    fetch(/*[[@{/products/api/by-barcode}]]*/ '/products/api/by-barcode' + '?code=' + encodeURIComponent(code))
                        .then(function (res) {
                            if (res.status === 404) {
                                msg.className = 'form-hint mt-1 text-danger';
                                msg.innerHTML = '<i class="bi bi-x-circle me-1"></i>No se encontró ningún producto activo con ese código.';
                                return null;
                            }
                            return res.json();
                        })
                        .then(function (product) {
                            if (product && product.id) {
                                window.location.href = '/products/' + product.id;
                            }
                        })
                        .finally(function () {
                            input.disabled = false;
                        });
                });
            </script>

        </main>
    </div>
</body>
</html>
