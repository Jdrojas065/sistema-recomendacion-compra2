<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{layout/base :: head-assets}"></th:block>
    <title>Detalle del producto</title>
</head>
<body>
<div th:replace="~{layout/navbar :: navbar}"></div>
<div th:replace="~{layout/sidebar :: sidebar}"></div>
<div class="container-fluid">
        <div class="col-md-2 p-0" th:replace="~{layout/sidebar :: sidebar}"></div>
        <main class="py-4">

            <h2 class="mb-4" th:text="${product.name}">Producto</h2>

            <table class="table" style="max-width: 500px;">
                <tr><th>Categoría</th><td th:text="${product.category.name}"></td></tr>
                <tr><th>Precio</th><td th:text="${'$' + #numbers.formatDecimal(product.price, 1, 2)}"></td></tr>
                <tr><th>Stock actual</th><td th:text="${product.currentStock}"></td></tr>
                <tr><th>Stock mínimo</th><td th:text="${product.minimumStock}"></td></tr>
                <tr><th>Estado</th><td th:text="${product.active} ? 'Activo' : 'Inactivo'"></td></tr>
            </table>

            <a th:href="@{/inventory/rotation/{id}(id=${product.id})}" class="btn btn-outline-secondary btn-sm">Ver rotación</a>
            <a th:href="@{/predictions/traditional/{id}(id=${product.id})}" class="btn btn-outline-secondary btn-sm">Ver predicción</a>
            <a th:href="@{/inventory/history/{id}(id=${product.id})}" class="btn btn-outline-secondary btn-sm">Historial de movimientos</a>
            <a th:href="@{/products}" class="btn btn-secondary btn-sm">Volver</a>

        </main>
    </div>
</body>
</html>
