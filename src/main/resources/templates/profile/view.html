<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{layout/base :: head-assets}"></th:block>
    <title>Mi perfil</title>
</head>
<body>
<div th:replace="~{layout/navbar :: navbar}"></div>
<div th:replace="~{layout/sidebar :: sidebar}"></div>
<div class="container-fluid">
        <div class="col-md-2 p-0" th:replace="~{layout/sidebar :: sidebar}"></div>
        <main class=" py-4">
            <h2>Mi perfil</h2>
			<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            <p><strong>Nombre:</strong> <span th:text="${user.name}"></span></p>
            <p><strong>Correo:</strong> <span th:text="${user.email}"></span></p>
            <p><strong>Rol:</strong> <span th:text="${user.role}"></span></p>

			<hr>
			<h4>Verificación en dos pasos (MFA)</h4>
			<p th:if="${user.mfaEnabled}" class="text-success">✅ Activado</p>
			<p th:unless="${user.mfaEnabled}" class="text-muted">Desactivado</p>

			<div th:if="${user.mfaEnabled}">
			    <p class="text-muted small">
			        Códigos de respaldo disponibles: <strong th:text="${recoveryCodesRemaining}">0</strong> de 8
			    </p>
			    <form th:action="@{/profile/mfa/recovery-codes/regenerate}" method="post" class="d-inline"
			          onsubmit="return confirm('Esto invalida todos tus códigos anteriores. ¿Continuar?');">
			        <button type="submit" class="btn btn-outline-secondary btn-sm">
			            <i class="bi bi-arrow-repeat me-1"></i>Regenerar códigos
			        </button>
			    </form>
				<form th:action="@{/profile/mfa/disable}" method="post" class="d-inline">
				    <input type="text" name="code" class="form-control form-control-sm d-inline-block"
				           style="width: 100px;" placeholder="Código" required maxlength="6" pattern="[0-9]{6}">
				    <button type="submit" class="btn btn-outline-danger btn-sm">Desactivar MFA</button>
				</form>
			</div>
			<a th:unless="${user.mfaEnabled}" th:href="@{/profile/mfa/setup}" class="btn btn-primary btn-sm">
			    Activar MFA
			</a>
        </main>
</div>
</body>
</html>
