<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{layout/base :: head-assets}"></th:block>
    <title>Rotación de inventario</title>
</head>
<body>
<div th:replace="~{layout/navbar :: navbar}"></div>
<div th:replace="~{layout/sidebar :: sidebar}"></div>
<div class="container-fluid">
        <div class="col-md-2 p-0" th:replace="~{layout/sidebar :: sidebar}"></div>
        <main class="py-4">

            <h2 class="mb-4" th:text="'Rotación de ' + ${product.name}">Rotación</h2>

            <div class="card" style="max-width: 400px;">
                <div class="card-body">
                    <p>Valor de rotación: <strong th:text="${#numbers.formatDecimal(rotation.rotationValue(), 1, 2)}">0.00</strong></p>
                    <p>Clasificación:
                        <span class="badge" th:classappend="${rotation.classification() == 'HIGH'} ? 'bg-success' : 'bg-secondary'"
                              th:text="${rotation.classification()}">HIGH</span>
                    </p>
                </div>
            </div>

            <a th:href="@{/products/{id}(id=${product.id})}" class="btn btn-secondary btn-sm mt-3">Volver al producto</a>

        </main>
    </div>
</body>
</html>
