<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{layout/base :: head-assets}"></th:block>
    <title>Editar categoría</title>
</head>
<body>
<div th:replace="~{layout/navbar :: navbar}"></div>
<div th:replace="~{layout/sidebar :: sidebar}"></div>
<div class="container-fluid">
        <div class="col-md-2 p-0" th:replace="~{layout/sidebar :: sidebar}"></div>
        <main class=" py-4">

            <h2 class="mb-4">Editar categoría</h2>

            <form th:action="@{/categories/{id}/edit(id=${categoryForm.id})}" th:object="${categoryForm}" method="post" style="max-width: 500px;">
                <input type="hidden" th:field="*{id}">
                <div class="mb-3">
                    <label class="form-label">Nombre</label>
                    <input type="text" th:field="*{name}" class="form-control">
                    <div class="text-danger small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Descripción</label>
                    <textarea th:field="*{description}" class="form-control"></textarea>
                </div>

                <button type="submit" class="btn btn-primary">Guardar cambios</button>
                <a th:href="@{/categories}" class="btn btn-outline-secondary">Cancelar</a>
            </form>

        </main>
    </div>
</body>
</html>
